<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Browser Tab Title -->
  <title>Announcement Hub</title>

  <!-- Google Site Name Structured Data -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "Announcement Hub",
    "alternateName": "AnnounceHub",
    "url": "https://amilsunil.github.io/Announcement-Hub/"
  }
  </script>

  <!-- Search Engine Meta Tags -->
  <meta name="description" content="Never miss an announcement ever again. Stay connected with real-time school notices, event updates, emergency alerts, and department announcements.">
  <meta name="google-site-verification" content="googled9bdddaae3366d94" />

  <!-- Favicon Links for Google Search & Browsers -->
  <link rel="icon" type="image/png" sizes="32x32" href="https://amilsunil.github.io/Announcement-Hub/icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="https://amilsunil.github.io/Announcement-Hub/icon.png">
  <link rel="apple-touch-icon" href="https://amilsunil.github.io/Announcement-Hub/icon.png">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #0d1117;
      color: #c9d1d9;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      background-color: #161b22;
      border: 1px solid #30363d;
      border-radius: 12px;
      max-width: 500px;
      width: 100%;
      padding: 32px;
      text-align: center;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
    }

    .logo {
      width: 96px;
      height: 96px;
      border-radius: 20%;
      margin-bottom: 20px;
      object-fit: cover;
    }

    h1 {
      color: #f0f6fc;
      font-size: 1.8rem;
      margin-bottom: 12px;
    }

    p {
      color: #8b949e;
      font-size: 0.95rem;
      line-height: 1.5;
      margin-bottom: 28px;
    }

    .download-buttons {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 12px 20px;
      font-size: 1rem;
      font-weight: 600;
      text-decoration: none;
      border-radius: 6px;
      transition: background-color 0.2s ease, transform 0.1s ease;
    }

    .btn-android {
      background-color: #238636;
      color: #ffffff;
    }

    .btn-android:hover {
      background-color: #2ea043;
    }

    .btn-linux {
      background-color: #21262d;
      color: #c9d1d9;
      border: 1px solid #30363d;
    }

    .btn-linux:hover {
      background-color: #30363d;
    }

    .footer {
      margin-top: 28px;
      font-size: 0.8rem;
      color: #484f58;
    }
  </style>
</head>
<body>

  <div class="container">
    <img src="icon.png" alt="Announcement Hub Logo" class="logo">
    <h1>Announcement Hub</h1>
    <p>Never Miss an Announcement Ever Again. Stay connected with real-time school notices, event updates, emergency alerts, and department announcements.</p>

    <div class="download-buttons">
      <a href="https://github.com/amilsunil/Announcement-Hub/releases/download/v2.0.0/AnnounceHub_v2.0.apk" class="btn btn-android">
        Download for Android (.apk)
      </a>
      <a href="https://github.com/amilsunil/Announcement-Hub/releases/download/v2.0.0/AnnounceHub_v2.0_amd64.deb" class="btn btn-linux">
        Download for Linux (.deb)
      </a>
    </div>

    <div class="footer">
      Version 2.0.0 • Community Announcement App
    </div>
  </div>

</body>
</html>
